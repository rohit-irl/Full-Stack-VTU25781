<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopHub - Your Premium E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Navigation -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h1>🛍️ ShopHub</h1>
                </div>
                <nav class="nav">
                    <button class="nav-btn active" data-page="products">
                        Products
                    </button>
                    <button class="nav-btn" data-page="cart">
                        Cart <span class="cart-count">0</span>
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
        <div class="container">
            <!-- Products Page -->
            <section id="products-page" class="page active">
                <!-- Search Bar -->
                <div class="search-container">
                    <input 
                        type="text" 
                        id="search-input" 
                        class="search-input" 
                        placeholder="🔍 Search products by name..."
                        autocomplete="off"
                    >
                </div>

                <!-- Products Grid -->
                <div id="products-grid" class="products-grid">
                    <!-- Products will be dynamically inserted here -->
                </div>

                <!-- No Products Message -->
                <div id="no-products-msg" class="no-products-msg" style="display: none;">
                    <p>No products found matching your search.</p>
                </div>
            </section>

            <!-- Cart Page -->
            <section id="cart-page" class="page">
                <h2 class="page-title">Shopping Cart</h2>

                <!-- Empty Cart Message -->
                <div id="empty-cart-msg" class="empty-cart-msg">
                    <p>🛒 Your cart is empty</p>
                    <button class="btn btn-primary" id="continue-shopping-btn">Continue Shopping</button>
                </div>

                <!-- Cart Items -->
                <div id="cart-items-container" style="display: none;">
                    <div id="cart-items" class="cart-items">
                        <!-- Cart items will be dynamically inserted here -->
                    </div>

                    <!-- Cart Summary -->
                    <div class="cart-summary">
                        <div class="summary-row">
                            <span>Total Items:</span>
                            <span id="total-items">0</span>
                        </div>
                        <div class="summary-row">
                            <span>Subtotal:</span>
                            <span id="subtotal">₹0.00</span>
                        </div>
                        <div class="summary-row">
                            <span>Tax (10%):</span>
                            <span id="tax">₹0.00</span>
                        </div>
                        <div class="summary-row total">
                            <span>Total Amount:</span>
                            <span id="total-amount">₹0.00</span>
                        </div>
                        <button class="btn btn-success" id="checkout-btn">Proceed to Checkout</button>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 ShopHub. All rights reserved. | Premium Shopping Experience</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
