<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tantraz 2026 | Registration</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background -->
  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="grid"></div>

  <!-- Card -->
  <div class="card">
    <h1>Tantraz 2026</h1>
    <p class="subtitle">Where Chaos Meets Creativity</p>

    <form id="form">
      <div class="input-group">
        <input type="text" required placeholder=" " />
        <label>Full Name</label>
      </div>

      <div class="input-group">
        <input type="email" required placeholder=" " />
        <label>Email</label>
      </div>

      <div class="input-group">
        <input type="tel" required placeholder=" " />
        <label>Phone</label>
      </div>

      <div class="input-group">
        <select required class="has-value">
          <option value="" disabled selected hidden></option>
          <option>Solo Events</option>
          <option>Team Events</option>
          <option>Workshops</option>
          <option>All Access Pass</option>
        </select>
        <label>Event Type</label>
      </div>

      <button type="submit" class="btn">ENTER TANTRAZ ⚡</button>
    </form>

    <span class="footer-text">© Tantraz 2026</span>
  </div>

  <!-- Success Animation -->
  <div class="success-overlay" id="success">
    <div class="success-box">
      <div class="checkmark">✔</div>
      <h2>Registered!</h2>
      <p>Welcome to Tantraz 2026 ⚡</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
