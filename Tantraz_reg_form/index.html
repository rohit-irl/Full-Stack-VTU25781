<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section>
        <div>
            <form action="/submit">
                <label for="user-name"></label>
                <input id="user-name" type="text" placeholder="Name">
                <label for="user-email"></label>
                <input id="user-email" type="email" placeholder="Enter your email">
                <label for="user-ph"></label>
                <input id="user-num" type="number" placeholder="Phone number">
                <label for="user-add"></label>
                <input id="user-add" type="text" placeholder="Address">
                <label for="user-city"></label>
                <input id="user-city" type="text" placeholder="City">
                <label for="user-state"></label>
                <input id="user-state" type="text" placeholder="State">
                <label for="user-zip"></label>
                <input id="user-zip" type="number" placeholder="ZIP Code">
            </form>
        </div>
    </section>
</body>
</html>
