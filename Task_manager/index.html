<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - To-Do List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <h1 class="app-title">My Tasks</h1>
            <p class="app-subtitle">Stay organized and productive</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="Add a new task..."
                        autocomplete="off"
                    >
                    <button id="addBtn" class="add-btn">
                        <span class="btn-icon">+</span>
                        Add Task
                    </button>
                </div>
            </div>

            <!-- Filter Section -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">
                    All Tasks
                </button>
                <button class="filter-btn" data-filter="pending">
                    Pending
                </button>
                <button class="filter-btn" data-filter="completed">
                    Completed
                </button>
            </div>

            <!-- Task List Container -->
            <div class="tasks-container">
                <ul id="taskList" class="task-list">
                    <!-- Tasks will be dynamically added here -->
                </ul>
                
                <!-- Empty State -->
                <div id="emptyState" class="empty-state">
                    <p class="empty-message">No tasks yet. Add one to get started!</p>
                </div>
            </div>

            <!-- Footer Section with Stats -->
            <footer class="footer-stats">
                <div class="stat-item">
                    <span class="stat-label">Total Tasks:</span>
                    <span id="totalCount" class="stat-value">0</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-label">Completed:</span>
                    <span id="completedCount" class="stat-value">0</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-label">Pending:</span>
                    <span id="pendingCount" class="stat-value">0</span>
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
